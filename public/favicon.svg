<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Tela / Monitor Externo -->
  <rect x="10" y="12" width="44" height="30" rx="4" fill="url(#screenGrad)" stroke="url(#primaryGrad)" stroke-width="2.5" />

  <!-- Suporte e Base do Monitor -->
  <path d="M28 42 L26 50 H38 L36 42" stroke="#64748B" stroke-width="2" stroke-linejoin="round" fill="none" />
  <line x1="22" y1="50" x2="42" y2="50" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />

  <!-- Símbolo de Compartilhamento / Transmissão Live Central -->
  <!-- Seta / Onda de Transmissão estilizada -->
  <path d="M23 27 L32 19 L41 27" stroke="url(#primaryGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="32" y1="21" x2="32" y2="34" stroke="url(#primaryGrad)" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)" />

  <!-- Ponto Indicador Live (Pulsante vermelho/coral no topo) -->
  <circle cx="48" cy="18" r="3" fill="#EF4444" />
  <circle cx="48" cy="18" r="5" stroke="#EF4444" stroke-width="1" opacity="0.6" />
</svg>
